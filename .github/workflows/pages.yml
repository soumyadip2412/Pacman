name: Deploy web version

# Builds a WebAssembly version of the game with pygbag and publishes it to
# the gh-pages branch, which GitHub Pages serves as a playable site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Test before deploying
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Build with pygbag
        run: |
          pip install pygbag==0.9.3
          mkdir -p dist/pacman
          cp main.py game.py maze.py pacman.py ghost.py astar.py bfs.py dfs.py utils.py dist/pacman/
          python -m pygbag --build --title "Intelligent Pac-Man" dist/pacman
          touch dist/pacman/build/web/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/pacman/build/web
          force_orphan: true
